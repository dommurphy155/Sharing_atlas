# Atlas Dashboard — HTTPS reverse proxy (subpath /atlas/)
#
# Install:
#   ln -s /etc/nginx/sites-available/atlas-dashboard /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Why a subpath: this box already terminates 443 for the Hermes dashboard with
# a cert for SERVER_HOST. A subpath reuses that cert and adds no new DNS,
# no new listener, and cannot disturb the existing site.
#
# The dashboard is bound to 127.0.0.1 only (DASHBOARD_HOST=127.0.0.1) so the
# management API is never directly reachable from the internet — nginx is the
# only way in, and it is the only place TLS terminates.

# --- Rate limiting zones ----------------------------------------------------
# Login: 5 requests/minute per IP (brute-force protection)
limit_req_zone $binary_remote_addr zone=atlas_login:10m rate=5r/m;

# API: 120 requests/minute per IP (general abuse protection)
limit_req_zone $binary_remote_addr zone=atlas_api:10m rate=120r/m;

# Key import: 30 requests/minute (bulk operations)
limit_req_zone $binary_remote_addr zone=atlas_keys:10m rate=30r/m;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=atlas_conn:10m;

server {
    listen 443 ssl;
    server_name SERVER_HOST;

    ssl_certificate     /etc/letsencrypt/live/SERVER_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SERVER_HOST/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/SERVER_HOST/chain.pem;

    # Hide nginx version
    server_tokens off;

    # --- Security headers (defense in depth; app also sets these) ----------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # --- Rate limiting + connection limiting --------------------------------
    limit_conn atlas_conn 10;

    # --- existing Hermes dashboard: unchanged -----------------------------
    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Atlas dashboard ---------------------------------------------------
    location /atlas {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Server-Sent Events for the live request stream: never buffer.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;

        # Uploads are not a feature here; keep the surface small.
        client_max_body_size 2m;

        # General API rate limit
        limit_req zone=atlas_api burst=20 nodelay;

        # Login endpoint: strict rate limit
        location = /atlas/api/auth/login {
            limit_req zone=atlas_login burst=3 nodelay;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        # Setup endpoint: strict rate limit
        location = /atlas/api/setup/complete {
            limit_req zone=atlas_login burst=2 nodelay;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        # Key import: moderate rate limit
        location = /atlas/api/keys/import {
            limit_req zone=atlas_keys burst=5 nodelay;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }
    }
}

server {
    listen 80;
    server_name SERVER_HOST;
    return 301 https://$host$request_uri;
}